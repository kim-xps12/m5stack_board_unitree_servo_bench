; AtomS3R firmware for the J288/S288 servo through the Unitree servo board (or the DYNAMIXEL TTL board).
; See README.md.
;   bench      measurement firmware driven by tools/bench.py
;   sin_swing  port of python/sin_swing_demo.py

[platformio]
default_envs = bench

[env]
platform = espressif32@6.12.0
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Icompat
    -I../external/digital_servo/stm32/firmware/App

; Both build the STM32 protocol code as-is (compat/gpio.h stands in for its HAL include).
[env:bench]
build_src_filter = +<bench/> +<../../external/digital_servo/stm32/firmware/App/protocol.c>

[env:sin_swing]
build_src_filter = +<sin_swing/> +<../../external/digital_servo/stm32/firmware/App/protocol.c>
